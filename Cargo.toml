[workspace]
resolver = "2"
members = [
    "crates/hermes-constants",
    "crates/hermes-time",
    "crates/hermes-utils",
    "crates/hermes-logging",
    "crates/hermes-state",
    "crates/hermes-toolsets",
    "crates/hermes-tools",
    "crates/hermes-providers",
    "crates/hermes-agent",
    "crates/hermes-cli",
    "crates/hermes-gateway",
    "crates/hermes-desktop",
    "crates/hermes-platforms",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.97"

[workspace.dependencies]
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
chrono-tz = { version = "0.10", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml = "0.9"
thiserror = "2"
unicode-width = "0.2"
hkdf = "0.12"
once_cell = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "socks"] }
log = "0.4"
sha2 = "0.10"
aes-gcm = "0.10"
base64 = "0.22"
fancy-regex = "0.14"
parking_lot = "0.12"
rand = "0.10"
regex = "1"
tempfile = "3"
url = "2"

[profile.dev]
# JEV efficiency: line-tables-only keeps backtraces while roughly halving
# test-binary size vs full debuginfo; no observable behavior change.
debug = 1

[profile.release]
lto = "thin"
# JEV cost-efficiency: strip symbols from release artifacts.
strip = true
