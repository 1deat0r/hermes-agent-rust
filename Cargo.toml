[workspace]
resolver = "2"
members = [
    "crates/hermes-constants",
    "crates/hermes-time",
    "crates/hermes-utils",
    "crates/hermes-logging",
    "crates/hermes-state",
    "crates/hermes-toolsets",
    "crates/hermes-tools",
    "crates/hermes-providers",
    "crates/hermes-agent",
    "crates/hermes-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.97"

[workspace.dependencies]
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
chrono-tz = { version = "0.10", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml = "0.9"
thiserror = "2"
once_cell = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "socks"] }
log = "0.4"
sha2 = "0.10"

[profile.dev]
debug = true

[profile.release]
lto = "thin"
