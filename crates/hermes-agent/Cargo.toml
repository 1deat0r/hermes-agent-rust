[package]
name = "hermes-agent"
description = "1:1 Rust port of agent/ surfaces (Nous Research Hermes Agent)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
base64 = "0.22"
chrono.workspace = true
libc = { version = "0.2", default-features = false }
once_cell = "1"
regex = "1"
fs2 = "0.4"
hermes-constants = { path = "../hermes-constants" }
hermes-logging = { path = "../hermes-logging" }
hermes-providers = { path = "../hermes-providers" }
hermes-utils = { path = "../hermes-utils" }
log.workspace = true
rand = "0.10"
reqwest.workspace = true
serde_json.workspace = true
sha2 = "0.10"
hkdf = "0.12"
aes-gcm = "0.10"
unicode-width = "0.2"
tempfile = "3"
zip = { version = "2", default-features = false, features = ["deflate"] }
thiserror.workspace = true
url = "2"

[dev-dependencies]
parking_lot = "0.12"
