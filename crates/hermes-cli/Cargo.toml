version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
async-trait = "0.1"
once_cell.workspace = true
base64.workspace = true
sha2.workspace = true
rand.workspace = true
futures = { version = "0.3", default-features = false, features = ["executor"] }
