thiserror.workspace = true
libc = { version = "0.2", default-features = false }
rusqlite = { version = "0.37", features = ["bundled"] }
fancy-regex.workspace = true
hermes-constants = { path = "../hermes-constants" }
hermes-utils = { path = "../hermes-utils" }
