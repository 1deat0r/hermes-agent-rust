[package]
name = "hermes-tools"
version = "0.1.0"
edition.workspace = true

[dev-dependencies]
base64 = "0.22"
serde_json = "1"
tempfile = "3"

[dependencies]
chrono = { workspace = true }
fancy-regex = "0.14"
hermes-constants = { path = "../hermes-constants" }
shellexpand = "3"
roxmltree = "0.20"
zip = { version = "2", default-features = false, features = ["deflate"] }
regex = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
hermes-state = { path = "../hermes-state" }
serde_json = { workspace = true }
once_cell = { workspace = true }
log = "0.4"
hermes-utils = { version = "0.1.0", path = "../hermes-utils" }
sha2 = "0.11.0"
